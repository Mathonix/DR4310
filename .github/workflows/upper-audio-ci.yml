name: Upper AUDIO PR Verification
on:
  pull_request:
    paths: ["upper/**", ".github/workflows/upper-audio-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: upper/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:client
      - run: npm run test:audio
      - run: npm run build:pages
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/screenshot-audio.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dr4310-upper-audio-screenshot
          path: |
            upper/dist/audio-panel.png
            upper/dist/audio-panel-dark.png
          if-no-files-found: error
